name: GENESIS 47 — Windows build and tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['project.godot', 'main.tscn', 'scripts/**', 'shaders/**', 'tools/**', 'assets/**', 'export_presets.cfg', '.github/workflows/build.yml']
permissions:
  contents: read
concurrency:
  group: genesis-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Download free licensed art
        run: python3 tools/fetch_assets.py
      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.zip
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -r /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Import resources and check scripts
        run: |
          set -o pipefail
          godot --headless --path . --editor --import 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|SHADER ERROR' import.log; then exit 1; fi
      - name: Test simulated paths and powers
        run: |
          set -o pipefail
          timeout 180s godot --headless --path . -- --self-test 2>&1 | tee smoke.log
          grep -q 'SELF_TEST PASS' smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|SHADER ERROR' smoke.log; then exit 1; fi
      - name: Extended quality assurance and long simulation
        run: |
          set -o pipefail
          timeout 480s godot --headless --path . -- --qa-test 2>&1 | tee qa.log
          grep -q 'QA_SUITE PASS' qa.log
          test -s qa-report.json
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|SHADER ERROR' qa.log; then exit 1; fi
      - name: Capture real rendered screenshot
        run: |
          set -o pipefail
          timeout 180s xvfb-run -a -s '-screen 0 1440x900x24' godot --path . --rendering-method gl_compatibility --resolution 1440x900 -- --capture 2>&1 | tee render.log
          test -s preview.png
          test -s preview-gameplay.png
          test -s preview-creature.png
          for scene in frontier city river cave; do test -s "preview-$scene.png"; done
          for pose in walk farm craft eat sleep social; do test -s "preview-pose-$pose.png"; done
          if grep -E 'SCRIPT ERROR|Parse Error|SHADER ERROR' render.log; then exit 1; fi
      - name: Benchmark graphical integration
        run: |
          set -o pipefail
          timeout 100s xvfb-run -a -s '-screen 0 1440x900x24' godot --path . --resolution 1440x900 -- --benchmark-test 2>&1 | tee benchmark.log
          grep -q BENCHMARK_COMPLETE benchmark.log
          if grep -E 'SCRIPT ERROR|Parse Error|SHADER ERROR' benchmark.log; then exit 1; fi
      - name: Export Windows x64
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/GENESIS47.exe
          test -s build/GENESIS47.exe
          cp README.md ASSET-CREDITS.md PLAYTEST.md qa-report.json build/
          for img in preview*.png; do if [ -f "$img" ]; then cp "$img" build/; fi; done
          cp assets/generated/catalog.json build/asset-catalog.json
          cp tools/BENCHMARK.bat build/
          test ! -e build/AI
          test ! -e build/GIOCA-CON-AI.bat
      - uses: actions/upload-artifact@v4
        with:
          name: GENESIS-47-Windows
          path: build/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: |
            *.log
            qa-report.json
            preview*.png
            assets/generated/catalog.json
          retention-days: 7
  windows-smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GENESIS-47-Windows
          path: build
      - name: Start exported Windows executable
        shell: pwsh
        run: |
          $p=Start-Process -FilePath (Resolve-Path 'build/GENESIS47.exe') -ArgumentList '--headless','--','--self-test' -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'Windows self-test timed out' }
          if ($p.ExitCode -ne 0) { throw "Windows exit code $($p.ExitCode)" }

      - name: Verify offline distribution
        shell: pwsh
        run: |
          if (Test-Path 'build/AI') { throw 'Unexpected AI runtime' }
          if (Test-Path 'build/GIOCA-CON-AI.bat') { throw 'Unexpected AI launcher' }
          if (Get-ChildItem build -Recurse -Filter '*.gguf') { throw 'Unexpected model weights' }
